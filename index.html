<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Idle Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="ui-root">
    <div id="top-bar">
        <div class="box" id="resource-box">
            <h3>Gold: <span id="gold">0</span></h3>
            <h3>Prestige Tokens: <span id="prestige-tokens">0</span></h3>
        </div>

        <div class="box" id="title-box">
            <h3>Wood Idle</h1>
        </div>

        <div class="box" id="settings-box" role="button" tabindex="0" aria-label="Open settings">
            <h3>Settings</h3>
        </div>

        <div id="settings-modal" class="modal hidden" aria-hidden="true">
            <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="settings-title">
                <div class="modal-header">
                    <h3 id="settings-title">Settings</h3>
                    <button id="close-settings" type="button" aria-label="Close settings">×</button>
                </div>

                <div class="modal-actions">
                    <button id="export-save-btn" type="button">Export Save</button>
                    <button id="import-save-btn" type="button">Load Save</button>
                    <input id="import-save-input" type="file" accept=".json,application/json" hidden>
                </div>
            </div>
        </div>
    </div>

    <div id="main-area">
        <div id="building-area" class="box">
            <div id="blacksmith" class="">
                <h2 class="blacksmith-title">Blacksmith</h2>
            </div>
            <div id="shrine" class="hidden">
                <div class="shrine-top-section">
                    <h2 class="blacksmith-title">Shrine</h2>
                    <div class="shrine-summary">
                        <div class="shrine-stats">
                            <div class="shrine-stat">
                                <span class="shrine-stat-label">Total Earnings</span>
                                <strong id="shrine-earnings">1</strong>
                            </div>
                            <div class="shrine-stat">
                                <span class="shrine-stat-label">Prestige Tokens</span>
                                <strong id="shrine-prestige">1</strong>
                            </div>
                        </div>
                        <button id="prestige-button" class="upgrade-count shrine-prestige">Prestige</button>
                    </div>
                </div>
            </div>
            <div id="library" class="hidden"></div>
        </div>

        <div id="side-area" class="box">
            <div id="levels" >
                <div id="level-top">
                    <div id="level-progress-container">
                        <span id="level-progress-text">0 / 1</span>
                        <span id="level-target-text">Level 2</span>
                    </div>
                    <div class="progress-container">
                        <div class="progress-fill" id="level-progress-bar"></div>
                    </div>
                </div>
                <div id="level-list"></div>
            </div>
            <div id="area-upgrades"></div>
        </div>

        <div id="wood_area" class="box">
            <div id="area_selector"></div>
            <img src="res/backgrounds/oak-cartoon.jpg" id="wood_canvas" alt="Tree" />

            <div id="wood-data" class="box" style="width: 100%;"> 
    
                <div style="display: flex; align-items: center; gap: 12px; width: 100%;">
                    
                    <span id="wood-type-box" style="font-weight: bold;">Oak</span>
                    
                    <span id="health-ratio" style="width:100px">0.0s</span>
                    <div class="progress-container" style="flex-grow: 1;">
                        <div class="progress-fill" id="chop-progress-bar"></div>
                    </div>
                    <span id="wood-count" style="white-space: nowrap; flex-shrink: 0;">1 log</span>
                </div>

                <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                    <span id="chop-speed">Chop Speed: 1.0x</span>
                    <span id="sell-price">Sell Price: $1.00</span>
                    <span id="profit">Profit: $1.00</span>
                </div>

            </div>
            
            
        </div>
    </div>

</div>

<script type="module" src="dist/game.js"></script>
</body>
</html>
